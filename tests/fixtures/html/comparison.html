<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comparison Page</title>
    <meta name="description" content="Compare our product with competitors">
</head>
<body>
    <header>
        <h1>Product Comparison</h1>
        <p>See how we stack up against the competition.</p>
    </header>
    <main>
        <h2>Competitors</h2>
        <ul>
            <li><a href="https://competitor1.com">Competitor One</a></li>
            <li><a href="https://competitor2.com">Competitor Two</a></li>
            <li><a href="https://competitor3.com">Competitor Three</a></li>
        </ul>
        <h2>Comparison Table</h2>
        <table>
            <thead>
                <tr>
                    <th>Feature</th>
                    <th>Us</th>
                    <th>Competitor 1</th>
                    <th>Competitor 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Price</td>
                    <td>$10</td>
                    <td>$12</td>
                    <td>$8</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
