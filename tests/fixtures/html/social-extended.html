<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Social Icons & JSON-LD</title>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "John Doe",
        "sameAs": [
            "https://bsky.app/profile/johndoe.bsky.social",
            "https://mastodon.social/@johndoe",
            "https://twitch.tv/johndoe",
            "https://snapchat.com/add/johndoe",
            "https://wa.me/1234567890",
            "https://t.me/johndoe",
            "https://behance.net/johndoe",
            "https://dribbble.com/johndoe",
            "https://flickr.com/johndoe",
            "https://tiktok.com/@johndoe"
        ]
    }
    </script>
</head>
<body>
    <a href="https://bsky.app/profile/johndoe">Bluesky</a>
    <a href="https://mastodon.social/@johndoe">Mastodon</a>
    <a href="https://twitch.tv/johndoe">Twitch</a>
    <i class="fa fa-linkedin"></i>
    <i class="fa fa-youtube"></i>
    <i class="fa fa-twitter"></i>
</body>
</html>
