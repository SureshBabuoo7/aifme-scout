<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Content Test Page</title>
    <meta name="description" content="A page with various content elements">
</head>
<body>
    <nav aria-label="breadcrumb">
        <ol>
            <li><a href="/">Home</a></li>
            <li><a href="/products">Products</a></li>
            <li>Product Details</li>
        </ol>
    </nav>
    <header>
        <h1>Welcome to Our Store</h1>
        <p>This is the best store ever.</p>
    </header>
    <main>
        <h2>Products</h2>
        <ul>
            <li>Product A</li>
            <li>Product B</li>
            <li>Product C</li>
        </ul>
        <h3>Featured</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Product A</td>
                    <td>$10</td>
                </tr>
                <tr>
                    <td>Product B</td>
                    <td>$20</td>
                </tr>
            </tbody>
        </table>
        <img src="/images/product.jpg" alt="Product image">
        <a href="/checkout">Checkout</a>
        <button type="submit">Add to Cart</button>
        <form action="/submit" method="post">
            <input type="text" name="name">
            <input type="email" name="email">
        </form>
    </main>
    <footer>
        <p>&copy; 2024 My Store</p>
    </footer>
</body>
</html>
