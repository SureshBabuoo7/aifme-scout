[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aifme-scout"
version = "1.0.0"
description = "Open-source website and marketing intelligence toolkit. Scan any URL to get a structured, evidence-linked snapshot of technology, SEO, content, and competitor signals."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "AIFME", email = "oss@aifme.com"},
]
keywords = [
    "marketing-intelligence",
    "web-scraping",
    "seo",
    "fastapi",
    "cli",
    "json-schema",
    "website-intelligence",
    "competitor-analysis",
    "technology-detection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.100.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
    "pyyaml>=6.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
    "types-PyYAML>=6.0",
    "types-beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/SureshBabuoo7/aifme-scout"
Documentation = "https://github.com/SureshBabuoo7/aifme-scout/blob/master/docs/QUICK_START.md"
Repository = "https://github.com/SureshBabuoo7/aifme-scout"
Changelog = "https://github.com/SureshBabuoo7/aifme-scout/blob/master/CHANGELOG.md"
Issues = "https://github.com/SureshBabuoo7/aifme-scout/issues"

[project.scripts]
aifme-scout = "aifme_scout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aifme_scout"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "DTZ", "T10", "ISC"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["aifme_scout"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra -q"
minversion = "8.0"

[tool.coverage.run]
source = ["aifme_scout"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
