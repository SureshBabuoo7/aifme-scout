<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="none" stroke="#0f3460" stroke-width="2" opacity="0.3"/>
  <circle cx="1180" cy="540" r="200" fill="none" stroke="#e94560" stroke-width="2" opacity="0.2"/>
  <circle cx="640" cy="320" r="300" fill="none" stroke="#0f3460" stroke-width="1" opacity="0.2"/>
  
  <!-- Grid lines -->
  <g opacity="0.05">
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#ffffff" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#ffffff" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Main content -->
  <text x="640" y="240" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">AIFME Scout OSS</text>
  <text x="640" y="310" font-family="Arial, sans-serif" font-size="28" fill="#a0a0b0" text-anchor="middle">Website &amp; Marketing Intelligence Toolkit</text>
  
  <!-- Accent line -->
  <rect x="400" y="340" width="480" height="4" rx="2" fill="url(#accent)"/>
  
  <!-- Version badge -->
  <rect x="540" y="370" width="200" height="40" rx="20" fill="#e94560" opacity="0.9"/>
  <text x="640" y="396" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">v1.0.0-rc2</text>
  
  <!-- Tech stack pills -->
  <text x="640" y="470" font-family="Arial, sans-serif" font-size="18" fill="#a0a0b0" text-anchor="middle">Python · FastAPI · BeautifulSoup · JSON Schema</text>
  
  <!-- Bottom text -->
  <text x="640" y="560" font-family="Arial, sans-serif" font-size="16" fill="#606080" text-anchor="middle">Open-source · Self-hosted · Deterministic · Evidence-linked</text>
</svg>
